name: theme assets

on:
  schedule:
    - cron: "15 * * * *"  # hourly, so holiday palettes switch on and off close to when GitHub does
  push:
    branches: [main]
    paths: ["assets/**", ".github/scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render assets
        run: python3 .github/scripts/static_assets.py dist

      # single-commit branch, so updates never pile up in the history
      - name: Publish to the theme branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b theme
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "chore: update theme assets"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" theme
